services:
  backend:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/vehicle-backend:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DETECTOR=${DETECTOR:-improved_centernet}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-vehicle-detection@demo.local}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.35}
      - DATABASE_PATH=${DATABASE_PATH:-backend/data/runs.db}
    volumes:
      - checkpoints_data:/app/backend/checkpoints
      - sqlite_data:/app/backend/data
      - uploads_data:/app/backend/media/uploads
      - outputs_data:/app/backend/media/outputs
      - torch_cache:/home/appuser/.cache/torch
    expose:
      - "8000"

  frontend:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/vehicle-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  checkpoints_data:
  sqlite_data:
  uploads_data:
  outputs_data:
  torch_cache:
